# Set your personal hyprland configuration here
# See https://wiki.hypr.land/Configuring for more information

# // █ █▄░█ █▀█ █░█ ▀█▀
# // █ █░▀█ █▀▀ █▄█ ░█░


#  Uncomment to enable // change to a preferred value
# 🔗 See https://wiki.hypr.land/Configuring/Variables/#input
input {
    # kb_layout = us
    # follow_mouse = 1
    # sensitivity = 0
    # force_no_accel = 0
    # accel_profile = flat
    # numlock_by_default = true

    # 🔗 See https://wiki.hypr.land/Configuring/Variables/#touchpad
    touchpad {
        natural_scroll = no
    }

}



# 🔗 See https://wiki .hyprland.org/Configuring/Variables/#gestures
gestures {
#     workspace_swipe = true
#     workspace_swipe_fingers = 3
}

# for window shallow similar to devour
misc {
    # enable_swallow = true
    # swallow_regex = (foot|kitty|allacritty|Alacritty|ghostty|Ghostty|org.wezfurlong.wezterm)
}

# Don't show update on first launch
ecosystem {
  # no_update_news = true
}

# Keybinding for Omarchy Menu
bindd = SUPER, O, Omarchy menu, exec, omarchy-menu

# Emacs
bindd = $mainMod SHIFT, E, Launch Emacs, exec, bash -c "emacs"
bindd = META, E, Open vterm frame, exec, emacsclient -n -e '(my/new-frame-with-vterm)'
bindd = $mainMod, SPACE, Universal launcher, exec, $HOME/.local/bin/emacs-launcher '(progn (select-frame-set-input-focus (selected-frame)) (universal-launcher-popup))'
bindd = CTRL SHIFT, x, Org roam daily capture, exec, $HOME/.local/bin/emacs-launcher '(progn (select-frame-set-input-focus (selected-frame)) (org-roam-dailies-capture-today))'
bindd = CTRL SHIFT, c, Org capture, exec, $HOME/.local/bin/emacs-launcher '(progn (select-frame-set-input-focus (selected-frame)) (org-capture))'
bindd = $mainMod CTRL, F, Dirvish file manager, exec, $HOME/.local/bin/emacs-launcher '(progn (select-frame-set-input-focus (selected-frame)) (dirvish))'
bindd = $mainMod, P, Password store, exec, $HOME/.local/bin/emacs-launcher '(progn (select-frame-set-input-focus (selected-frame)) (pass) (call-interactively (quote pass-goto-entry)))'
bindd = CTRL SHIFT, D, Download media, exec, $HOME/.local/bin/emacs-launcher '(progn (select-frame-set-input-focus (selected-frame)) (jb/download-media))'
bindd = $mainMod, C, Org agenda dashboard, exec, $HOME/.local/bin/emacs-launcher '(progn (select-frame-set-input-focus (selected-frame)) (my/org-agenda-dashboard))'
bindd = $mainMod, M, MU4e mail, exec, $HOME/.local/bin/emacs-launcher '(progn (select-frame-set-input-focus (selected-frame)) (mu4e))'
bindd = $mainMod CTRL, Z, Elfeed, exec, $HOME/.local/bin/emacs-launcher '(progn (select-frame-set-input-focus (selected-frame)) (elfeed))'
bindd = $mainMod CONTROL, M, EMMS music player, exec, $HOME/.local/bin/emacs-launcher '(progn (select-frame-set-input-focus (selected-frame)) (emms-playlist-mode-go))'
bindd = $mainMod CONTROL, E, Emacs everywhere, exec, emacsclient --eval '(thanos/type)'
bindd = $mainMod CTRL, Y, Clipboard manager, exec, $HOME/.local/bin/emacs-launcher '(progn (select-frame-set-input-focus (selected-frame)) (jb/clipboard-manager))'



